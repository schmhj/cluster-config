apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
    - name: test-container
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "written by test-pod at $(date +%Y-%m-%dT%H:%M:%S%z)" > /mnt/paperless/media/test-pod-start.txt
          while true; do sleep 3600; done
      volumeMounts:
        - name: nfs-storage
          mountPath: /mnt/paperless
  volumes:
    - name: nfs-storage
      persistentVolumeClaim:
        claimName: test-pvc