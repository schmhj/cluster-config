---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-restart
  namespace: workloads
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-restart
  namespace: workloads
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-restart
  namespace: workloads
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: immich-restart
subjects:
  - kind: ServiceAccount
    name: immich-restart
    namespace: workloads
