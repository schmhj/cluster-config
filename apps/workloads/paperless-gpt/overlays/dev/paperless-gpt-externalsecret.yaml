apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt-credentials
  namespace: workloads
spec:
  secretStoreRef:
    kind: SecretStore
    name: doppler-paperless-gpt
  target:
    name: paperless-gpt-credentials
    creationPolicy: Owner
  data:
    - secretKey: paperless-token
      remoteRef:
        key: PAPERLESS_TOKEN
