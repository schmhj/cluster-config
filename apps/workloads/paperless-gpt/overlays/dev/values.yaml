# Dev overlay — comment block only; no value overrides.
#
# Why env lives in base: the app's environment (Paperless URL, Ollama host,
# model/worker tuning) is identical for every environment that runs this
# chart; per-env differences (URLs, models) belong in overlays later if
# they ever diverge. Keeping it in base means one source of truth and an
# empty dev overlay, so dev never drifts from the chart defaults.
#
# Loseable dev state: persistence.enabled=false in base plus emptyDir
# mounts at /app/prompts, /app/config and /app/db — state is wiped on
# restart. That is acceptable in dev — the source of truth lives in
# paperless-ngx + this repo. The mounts themselves are required (the
# image's non-root entrypoint cannot mkdir in root-owned /app); do not
# remove them or enable a PVC here without a deliberate decision.
#
# OCR vision fallback: OCR_PROVIDER defaults to "llm" and is deliberately
# unconfigured — OCR-vision and RAG are out of scope for this dev app
# (see base header). If the pod fails startup validation for missing
# vision config, add to base config:
#   VISION_LLM_PROVIDER: "ollama"
#   VISION_LLM_MODEL: "qwen2.5vl:3b"
# and add `qwen2.5vl:3b` to ollama's pull list
# (apps/workloads/ollama/base/values.yaml ollama.models.pull).
