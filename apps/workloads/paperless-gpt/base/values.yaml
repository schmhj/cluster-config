# paperless-gpt (taskmedia chart 0.3.0, upstream icereed image) — dev.
# Tagging/title suggestions only; OCR-vision and RAG deliberately unconfigured.
# No built-in auth: exposure is NodePort (localhost) + Traefik basic auth.

fullnameOverride: paperless-gpt

image:
  repository: icereed/paperless-gpt
  tag: v0.31.0
  pullPolicy: IfNotPresent

paperless:
  baseUrl: "http://paperless.workloads.svc.cluster.local"
  apiTokenExistingSecret:
    name: paperless-gpt-credentials
    key: paperless-token

config:
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "qwen2.5:3b"
  OLLAMA_HOST: "http://ollama.workloads.svc.cluster.local:11434"
  OLLAMA_KEEP_ALIVE: "10m"
  LLM_LANGUAGE: "English"
  TOKEN_LIMIT: "1000"
  SUGGESTION_WORKERS: "1"
  OCR_LIMIT_PAGES: "2"

# Loseable dev state: keep persistence off so prompts/config/db live in the
# container's writable layer (emptyDir-equivalent, wiped on restart) rather
# than a PVC. The source of truth stays in paperless-ngx + this repo.
persistence:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
