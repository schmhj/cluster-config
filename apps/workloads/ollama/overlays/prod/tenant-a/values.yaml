# Ollama — prod tenant-a (local LLM for paperless-gpt).
# workload-0 boot fs is ~35 GiB with ~8.5 GiB free: model weights MUST live on
# the PVC below, not ephemeral storage.

fullnameOverride: ollama

# Fully-qualified repo: OKE nodes enforce containerd short-name mode.
image:
  repository: docker.io/ollama/ollama

ollama:
  models:
    pull:
      - qwen2.5:3b

persistentVolume:
  enabled: true
  size: 50Gi
  storageClass: oci-bv
  accessModes:
    - ReadWriteOnce

# workload-0 allocatable 2820m CPU with ~2.06 CPU already requested; 1 CPU
# request did not fit (FailedScheduling Insufficient cpu). 500m request keeps
# the pod schedulable; burst up to 4 CPU limit.
resources:
  requests:
    cpu: 500m
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 4Gi

nodeSelector:
  tier: workload
  workload: workload-0

tolerations:
  - key: tier
    operator: Equal
    value: workload
    effect: NoSchedule
