# Ollama — prod tenant-a (local LLM for paperless-gpt).
# workload-0 boot fs is ~35 GiB with ~8.5 GiB free: model weights MUST live on
# the PVC below, not ephemeral storage.

fullnameOverride: ollama

ollama:
  models:
    pull:
      - qwen2.5:3b

persistentVolume:
  enabled: true
  size: 50Gi
  storageClass: oci-bv
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 4Gi

nodeSelector:
  tier: workload
  workload: workload-0

tolerations:
  - key: tier
    operator: Equal
    value: workload
    effect: NoSchedule
