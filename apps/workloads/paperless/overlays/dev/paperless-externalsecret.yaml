apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-credentials
  namespace: workloads
spec:
  secretStoreRef:
    kind: SecretStore
    name: doppler-paperless
  target:
    name: paperless-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-username
      remoteRef:
        key: ADMIN_USERNAME
    - secretKey: admin-password
      remoteRef:
        key: ADMIN_PASSWORD
