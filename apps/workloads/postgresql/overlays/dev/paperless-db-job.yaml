apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-db-provision
  namespace: workloads
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: docker.io/library/postgres:18-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$PG_ADMIN_PASSWORD"
              PSQL="psql -h postgresql-dev -U postgres -v ON_ERROR_STOP=1 -q"

              if $PSQL -tAc "SELECT 1 FROM pg_roles WHERE rolname='paperless'" | grep -q 1; then
                $PSQL -c "ALTER ROLE paperless WITH LOGIN PASSWORD '${PAPERLESS_PASSWORD}'"
              else
                $PSQL -c "CREATE ROLE paperless WITH LOGIN PASSWORD '${PAPERLESS_PASSWORD}'"
              fi

              if $PSQL -tAc "SELECT 1 FROM pg_database WHERE datname='paperless'" | grep -q 1; then
                echo "database paperless already exists"
              else
                $PSQL -c "CREATE DATABASE paperless OWNER paperless"
              fi

          env:
            # Keep the existing secret references
            - name: PG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgresql-admin-password
            - name: PAPERLESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgresql-paperless-password