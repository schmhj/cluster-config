apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.csv: |
    # Format: p, subject, resource, action, object, effect
    p, role:automation-role, applications, sync, */*, allow
    p, role:automation-role, applications, get, */*, allow
    
    # Bind the automation user to the role
    g, automation-sa, role:automation-role
