---
# ── Middleware: strip path prefix before forwarding ──────────
# /api/users/* → users-svc:8080/  (prefix stripped)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: traefik
spec:
  stripPrefix:
    prefixes:
      - /app/api/templates
      - /app/api/samples

---
# ── IngressRoute: Traefik Dashboard (Codespaces HTTPS proxy) ─
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: (Host(`127.0.0.1`) || Host(`localhost`) || HostRegexp(`^.+\.github\.dev$`)) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      middlewares:
        - name: dashboard-auth
          namespace: traefik
      services:
        - name: api@internal     # Built-in Traefik API service
          kind: TraefikService

---
# ── IngressRoute: Microservices (Codespaces HTTPS proxy) ─────
# Covers: /api/sample, /api
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-microservices
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  # tls:
  #   secretName: letsencrypt-staging-account-key - for prod use only
  entryPoints:
    - web
    - websecure
  routes:
    # ── Microservie template Service ──────────────────────────────────────────
    - match: (Host(`127.0.0.1`) || Host(`localhost`) || HostRegexp(`^.+\.github\.dev$`)) && PathPrefix(`/app/api/templates`)
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-api-prefix
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: microservice-template
          namespace: workloads
          port: 9000
    
    
    # ── Sample Service ────────────────────────────────────────
    - match: (Host(`127.0.0.1`) || Host(`localhost`) || HostRegexp(`^.+\.github\.dev$`)) && PathPrefix(`/app/api/samples`)
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-api-prefix
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: sample-app
          namespace: workloads
          port: 8080

    - match: (Host(`127.0.0.1`) || Host(`localhost`) || HostRegexp(`^.+\.github\.dev$`)) && PathPrefix(`/argocd`)
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-api-prefix
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: argocd-server
          namespace: workloads
          port: 80
    
    - match: (Host(`127.0.0.1`) || Host(`localhost`) || HostRegexp(`^.+\.github\.dev$`)) && PathPrefix(`/paperless`)
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-api-prefix
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: paperless
          namespace: workloads
          port: 80