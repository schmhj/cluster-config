# Change service type
- op: replace
  path: /spec/type
  value: NodePort

# web port
- op: replace
  path: /spec/ports/0/nodePort
  value: 30480

# websecure port (443) — pinned so the k3d mapping 30443:30443 in
# .devcontainer/manifests/k3d-dev.yaml keeps matching after a resync
# (an unpinned nodePort is re-assigned whenever the Service is recreated)
- op: add
  path: /spec/ports/1/nodePort
  value: 30443
