---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tailscale-operator-peerrelays
rules:
  - apiGroups: ["tailscale.com"]
    resources: ["peerrelays"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tailscale.com"]
    resources: ["peerrelays/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-operator-peerrelays
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tailscale-operator-peerrelays
subjects:
  - kind: ServiceAccount
    name: operator
    namespace: tailscale
