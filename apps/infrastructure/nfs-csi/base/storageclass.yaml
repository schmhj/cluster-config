apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-paperless
provisioner: nfs.csi.k8s.io
parameters:
  server: 100.73.152.123
  share: /Volumes/HomeLab
  subDir: paperless
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
mountOptions:
  - nfsvers=3
  - hard
